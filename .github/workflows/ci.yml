name: CI

# The gate: every push to main (and every pull request) builds both platforms. The game's files are not public, so
# the suites that play the game (and the oracle comparisons) run where they are (meson setup -DgameDir=...
# [-DoracleTests=true]); here the gate is that everything builds, the test programs included. Release (release.yml)
# publishes only commits that passed here. Daily as well, to catch environment drift (runner images, toolchains)
# when nothing is committed.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  linux:
    # Ubuntu 22.04 (glibc 2.35): the executable runs on that and newer distributions. SDL2 is built in from the wrap
    # (static) and Munt with the C++ runtime is linked in; SDL loads X11 / Wayland / ALSA / PulseAudio at run time, so
    # the executable needs only the C library.
    name: linux (x86-64)
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config python3-pip \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev \
          libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libgl-dev libgles-dev \
          libasound2-dev libpulse-dev libdbus-1-dev libudev-dev
        # (22.04's meson is too old for this project)
        python3 -m pip install --user meson ninja
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Build the bundle (and the test programs)
      run: ./tools/build-bundle.sh --platform linux --out build/bundle-linux
    - uses: actions/upload-artifact@v4
      with:
        name: opensamurai-linux-x86_64
        path: build/bundle-linux/

  windows:
    # Cross-compiled on Linux with mingw-w64 (tools/x86_64-w64-mingw32.ini, static; SDL2's MinGW release)
    name: windows (x86-64)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends meson ninja-build cmake pkg-config mingw-w64 curl
    - name: Build the bundle
      run: ./tools/build-bundle.sh --platform windows --out build/bundle-windows
    - uses: actions/upload-artifact@v4
      with:
        name: opensamurai-windows-x86_64
        path: build/bundle-windows/
