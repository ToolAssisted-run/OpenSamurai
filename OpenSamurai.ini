; ==========================
; OpenSamurai configuration
; ==========================

; This is the configuration file of OpenSamurai's frontend (frontend/main.c).
; Lines starting with a semicolon (";") are comments and are ignored.
; "default" is a valid setting for any option.
;
; Every default is what OpenSamurai does without this file. OpenSamurai looks for it in this order:
;   1. OpenSamurai.ini in the current folder
;   2. OpenSamurai.ini next to the opensamurai program
;   3. OpenSamurai.ini in the game's folder
; Unknown options are reported on the terminal and ignored. The command line's options (/NT, /J, /NJ, /AA, /AR, /AI,
; /AT, /AN: the original setup's) win over this file's for that run.
;
; The in-game menu (F4) changes settings too, as SDLPoP's does: it saves them, when the menu closes, to OpenSamurai.cfg
; next to this file (in the game's folder when there is no OpenSamurai.ini), in this file's syntax, and OpenSamurai.cfg
; is read after this file - unless this file is newer (edited since): then OpenSamurai.cfg is ignored. Delete
; OpenSamurai.cfg to go back to this file's settings.


[General]
; Start the game in fullscreen mode. (In-game fullscreen toggle: Alt+Enter)
start_fullscreen = false

; Width and height of the game window, in pixels.
; By default (auto) the window is 960 x 720 (960 x 600 without the 4:3 aspect ratio below).
window_width = default
window_height = default

; Show the game in the 4:3 aspect ratio of the VGA's 320 x 200 picture on a monitor of the time (drawn 1.2 times
; taller than wide). false: square pixels (320 x 200 = 16:10).
use_correct_aspect_ratio = true

; Make all pixels the same size by using integer scale factors only (black borders fill the rest).
use_integer_scaling = false

; Scaling method.
; Possible values:
; * sharp  = Use nearest-neighbour resampling.
; * fuzzy  = First scale to double size with nearest-neighbour scaling, then scale to the window with smooth scaling.
; * blurry = Use smooth scaling.
scaling_type = sharp

; The sound card, as the original setup chooses it (the command line's /A<letter>). Takes effect at the next start.
; Possible values:
; * adlib   = the AdLib (the game folder's later ASOUND.SAM driver). (default)
; * mt32    = the Roland MT-32, emulated by Munt. Needs its ROMs (a control ROM and a PCM ROM, any names) in the folder
;             given by mt32_roms below, the "roms" folder of OpenSamurai's user data or next to the program, or the
;             game's folder (see README); without them, the AdLib.
; * speaker = the IBM PC speaker. (The title then runs slower, as in the original.)
; * tandy   = the Tandy 1000's sound chip.
; * none    = no sound.
sound = adlib

; Volume, 0 (silent) to 15 (full). (default = 15)
; The game's own Alt+V still chooses music and effects, effects only, or silence.
volume = 15

; The folder with the MT-32's ROMs (looked at after the OPENSAMURAI_MT32ROMS environment variable's, before the
; default places). Empty (default): the default places only.
mt32_roms = default

; Skip the title sequence (the command line's /NT). Takes effect at the next start.
skip_title = false


[Controller]
; A joystick or game controller that is plugged in is the game's joystick (the command line's /J; false: /NJ).
; OpenSamurai does the setup's calibration for you, and the game's Alt+J calibrates it again. A game controller's
; Start or Back button also opens the in-game menu. Takes effect at the next start.
enable_joystick = true


[AdditionalFeatures]
; The seed of every random number in a game.
; Possible values:
; * clock = the system's clock when OpenSamurai starts: a different game each time. (default)
; * a number = the same random numbers every time (OpenSamurai shows the seed of each run on the terminal).
; The OPENSAMURAI_SEED environment variable wins over it. Takes effect at the next start.
random_seed = clock
